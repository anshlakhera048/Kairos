<svg xmlns="http://www.w3.org/2000/svg" width="920" height="600">

    <style>
    text { font-family: "DejaVu Sans Mono", "JetBrains Mono", Menlo, Consolas, monospace;
           font-size: 14px; fill: #c9d4e3; }
    .prompt { fill: #4ade80; font-weight: bold; }
    .headline { fill: #fbbf24; font-weight: bold; }
    .dim { fill: #64748b; }
    .line { opacity: 0; animation: reveal 0.01s forwards; }
    @keyframes reveal { to { opacity: 1; } }
    .cursor { animation: blink 1.1s steps(1) infinite; }
    @keyframes blink { 50% { opacity: 0; } }
    </style>
<rect width="920" height="600" rx="10" fill="#0b0f17"/>
<rect width="920" height="36" rx="10" fill="#111827"/>
<rect y="26" width="920" height="10" fill="#111827"/>
<circle cx="24" cy="18" r="6" fill="#f87171"/>
<circle cx="44" cy="18" r="6" fill="#fbbf24"/>
<circle cx="64" cy="18" r="6" fill="#4ade80"/>
<text x="892" y="23" font-size="12" text-anchor="end" class="dim">kairos — live terminal cast</text>
<text x="28" y="44" class="line prompt" style="animation-delay:0.6s">$ kairos demo</text>
<text x="28" y="66" class="line" style="animation-delay:1.1s">running arena (C++): bots=as,fixed,momentum seeds=10 duration=30s regime=calm</text>
<text x="28" y="99.0" class="line" style="animation-delay:1.4s">Kairos Arena — 10 seeds x 30s · regime=calm · deterministic C++ engine</text>
<text x="28" y="121.0" class="line" style="animation-delay:1.6s">  #  bot           score  mean PnL($)    fills  seeds  dq</text>
<text x="28" y="143.0" class="line" style="animation-delay:1.9s">  1  fixed          0.92         0.31       18     10   1</text>
<text x="28" y="165.0" class="line" style="animation-delay:2.2s">  2  as             0.92         0.31       18     10   0</text>
<text x="28" y="187.0" class="line" style="animation-delay:2.5s">  3  momentum      -0.00         0.00        2     10   1</text>
<text x="28" y="209.0" class="line" style="animation-delay:2.7s">score = mean PnL - inventory penalty + risk-adjusted term</text>
<text x="28" y="257.4" class="line prompt" style="animation-delay:3.8s">$ kairos realism-gap</text>
<text x="28" y="279.4" class="line" style="animation-delay:4.3s">Realism gap — same strategy, same data, different fill honesty</text>
<text x="28" y="301.4" class="line" style="animation-delay:4.6s">generating 60s synthetic L2 capture (seed 7) ...</text>
<text x="28" y="323.4" class="line" style="animation-delay:4.9s">  L1 ...</text>
<text x="28" y="345.4" class="line" style="animation-delay:5.2s">  L2 ...</text>
<text x="28" y="367.4" class="line" style="animation-delay:5.4s">  L3 ...</text>
<text x="28" y="389.4" class="line" style="animation-delay:5.7s">  L4 ...</text>
<text x="28" y="411.4" class="line" style="animation-delay:6.0s">level  description                                      PnL   fills fill rate</text>
<text x="28" y="433.4" class="line" style="animation-delay:6.3s">   L1  naive: fill at touch, zero latency         $    7.61      91      6.6%</text>
<text x="28" y="455.4" class="line" style="animation-delay:6.5s">   L2  L1 + 5ms feed / 2ms order latency          $    7.22      90      6.5%</text>
<text x="28" y="477.4" class="line" style="animation-delay:6.8s">   L3  L2 + risk-averse queue                     $    5.14      69      5.0%</text>
<text x="28" y="499.4" class="line" style="animation-delay:7.1s">   L4  L2 + probabilistic queue                   $    5.42      73      5.3%</text>
<text x="28" y="532.4" class="line headline" style="animation-delay:7.4s">-&gt; naive fill-at-touch overstates PnL by 32.5% vs the risk-averse queue model</text>
<text x="28" y="554.4" class="line" style="animation-delay:7.6s">synthetic data: relative gap is the finding, absolute PnL is not tradable</text>
<rect x="28" y="588.8" width="9" height="17" fill="#4ade80" class="cursor" style="animation-delay:8.7s"/>
</svg>
